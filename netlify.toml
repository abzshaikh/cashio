[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# React Router (client-side routing) — every path must fall through to
# index.html so deep links and refreshes don't 404 on Netlify's static
# file server.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
